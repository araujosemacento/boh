<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&family=Outfit:wght@300..900&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('preferred-theme');
					if (saved) {
						document.documentElement.dataset.theme = saved;
					} else {
						var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
						document.documentElement.dataset.theme = isDark ? 'mocha' : 'latte';
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
